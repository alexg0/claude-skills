name: Tests

on: pull_request

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML validator dependency
        run: python -m pip install PyYAML
      - name: Python tests and skill metadata validation
        run: python -m unittest discover -s tests -v
      - name: Shell syntax and tooling tests
        run: |
          bash -n install.sh import.sh install-upstream.sh tests/test-tooling.sh
          bash tests/test-tooling.sh

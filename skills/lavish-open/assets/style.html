<style>
:root{color-scheme:light dark;--bg:#fbfaf7;--fg:#1d1f23;--mute:#5d6470;--rule:#e2ded5;--code:#f1eee7;--acc:#1f5f8b}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#e6e3dc;--mute:#9aa0aa;--rule:#2c3038;--code:#22252b;--acc:#7fb6dd}}
html{background:var(--bg)}body{max-width:46rem;margin:0 auto;padding:2.5rem 1rem 5rem;font:17px/1.6 Charter,"Iowan Old Style",Georgia,serif;color:var(--fg);background:var(--bg)}
h1,h2,h3,h4{font-family:-apple-system,"Helvetica Neue",sans-serif;line-height:1.25;margin-top:2.2em}h1{font-size:1.9rem;margin-top:0}h2{font-size:1.35rem;border-bottom:1px solid var(--rule);padding-bottom:.3em}h3{font-size:1.1rem}
a{color:var(--acc);overflow-wrap:anywhere}code{font:.86em ui-monospace,Menlo,monospace;background:var(--code);padding:.1em .3em;border-radius:3px;overflow-wrap:anywhere}
pre{background:var(--code);padding:1rem;border-radius:6px;overflow-x:auto}pre code{padding:0;background:none}
table{border-collapse:collapse;display:block;overflow-x:auto;font-size:.9em}th,td{border:1px solid var(--rule);padding:.35em .6em;text-align:left}
blockquote{margin:0;padding-left:1rem;border-left:3px solid var(--rule);color:var(--mute)}nav#TOC{font-size:.9em;border:1px solid var(--rule);border-radius:6px;padding:.5rem 1rem;margin-bottom:2rem}
</style>
